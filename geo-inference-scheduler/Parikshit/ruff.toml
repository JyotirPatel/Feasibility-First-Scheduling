# Lint settings for Parikshit's folder (brief §12: ruff for lint + format).
# `src` tells ruff which top-level packages are first-party, so the expected import order is the same
# wherever ruff is run from.
line-length = 120
target-version = "py311"
src = [".", "tests"]

[lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
